<style>
  :root{
    --paper:#f1e8d6;
    --paper-dark:#e3d5b8;
    --ink:#34261a;
    --ink-soft:#6b5640;
    --amber:#d9902f;
    --amber-deep:#b87414;
    --line:#d2c09a;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  .app{
    font-family:'Nunito Sans', sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .header{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .header h1{font-family:'Fredoka', sans-serif; font-weight:600; font-size:22px; margin:0;}
  .header p{margin:2px 0 0; font-size:13px; color:var(--ink-soft);}
  .note{font-size:12px; color:var(--ink-soft);}
  .layout{display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start;}
  .room-wrap{flex:0 1 720px; min-width:280px; width:100%;}
  .room{
    position:relative;
    width:720px;
    max-width:100%;
    aspect-ratio:904/615;
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--line);
    background:#1c1a14;
    touch-action:none;
    user-select:none;
  }
  .room > img.bg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; display:block;}
  .placed{
    position:absolute;
    transform:translate(-50%,-100%);
    cursor:grab;
    touch-action:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));
  }
  .placed:active{cursor:grabbing;}
  .placed img.art{display:block; width:100%; height:auto; pointer-events:none;}
  .placed .del{
    position:absolute; top:-10px; right:-10px;
    width:22px; height:22px; border-radius:50%;
    background:var(--amber-deep); color:#fff;
    border:2px solid var(--paper);
    font-size:13px; line-height:1;
    display:none; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .placed.selected .del{display:flex;}
  .placed.selected{outline:2px dashed #f6d77a; outline-offset:3px; border-radius:4px;}
  .room-footer{display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:10px; flex-wrap:wrap;}
  .hint{font-size:12px; color:var(--ink-soft);}
  .reset-btn{
    font-family:'Nunito Sans', sans-serif; font-size:12px; font-weight:700;
    color:var(--amber-deep); background:none;
    border:1px solid var(--amber); border-radius:20px;
    padding:5px 14px; cursor:pointer;
  }
  .reset-btn:hover{background:var(--amber); color:#fff;}
  .palette{
    flex:0 0 220px;
    background:var(--paper-dark);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px;
  }
  .palette h2{font-family:'Fredoka', sans-serif; font-size:15px; font-weight:600; margin:0 0 2px;}
  .palette .sub{font-size:11.5px; color:var(--ink-soft); margin:0 0 12px;}
  .items{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .item-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:10px; padding:8px 4px 6px; cursor:grab;
  }
  .item-btn:hover{border-color:var(--amber);}
  .item-btn .thumb{height:56px; display:flex; align-items:center; justify-content:center; width:100%;}
  .item-btn .thumb img{max-height:56px; max-width:100%; width:auto; height:auto;}
  .item-btn span{font-size:10.5px; font-weight:700; color:var(--ink-soft); text-align:center; line-height:1.2;}
</style>

  function toRoom(e){
    const r = room.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * VB_W, y: (e.clientY - r.top) / r.height * VB_H };
  }

  // Stacking: lower on screen = in front, EXCEPT pieces with a fixed layer z:
  //   z:1 = green cushion (always the very bottom)
  //   z:2 = bed (always above the cushion, but below every other piece)
  // These stay in that order even while being dragged.
  function place(el, item, def){
    el.style.left = (item.x / VB_W * 100) + '%';
    el.style.top  = (item.y / VB_H * 100) + '%';
    el.style.zIndex = def.z ? def.z : 10 + Math.round(item.y);
  }

  // palette
  Object.entries(CATALOG).forEach(([type, def])=>{
    const btn = document.createElement('div');
    btn.className = 'item-btn';
    btn.draggable = true;
    btn.innerHTML = `<div class="thumb"><img src="${def.img}" alt="${def.label}" draggable="false"></div><span>${def.label}</span>`;
    btn.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', type); });
    btn.addEventListener('click', ()=> addItem(type, 380 + (Math.random()*100-50), 300 + (Math.random()*40-20)));
    paletteEl.appendChild(btn);
  });

  room.addEventListener('dragover', e => e.preventDefault());
  room.addEventListener('drop', e=>{
    e.preventDefault();
    const type = e.dataTransfer.getData('text/plain');
    if(!CATALOG[type]) return;
    const p = toRoom(e);
    addItem(type, p.x, p.y + CATALOG[type].h / 2);
  });

  function addItem(type, x, y){
    const c = constrain(x, y);
    const id = 'i' + (uid++);
    state.push({id, type, x:c.x, y:c.y});
    selectedId = id;
    render();
  }

  function removeItem(id){
    state = state.filter(s => s.id !== id);
    if(selectedId === id) selectedId = null;
    render();
  }

  function render(){
    room.querySelectorAll('.placed').forEach(n => n.remove());
    state.forEach(item=>{
      const def = CATALOG[item.type];
      const el = document.createElement('div');
      el.className = 'placed' + (item.id === selectedId ? ' selected' : '');
      el.style.width = (def.w / VB_W * 100) + '%';
      el.dataset.id = item.id;
      el.innerHTML = `<img class="art" src="${def.img}" alt="${def.label}" draggable="false"><div class="del" title="Remove">×</div>`;
      place(el, item, def);
      room.appendChild(el);

      el.querySelector('.del').addEventListener('click', ev=>{ ev.stopPropagation(); removeItem(item.id); });

      let dragging = false, offX = 0, offY = 0;
      el.addEventListener('pointerdown', e=>{
        if(e.target.closest('.del')) return;
        dragging = true;
        el.setPointerCapture(e.pointerId);
        const p = toRoom(e);
        offX = item.x - p.x; offY = item.y - p.y;
        selectedId = item.id;
        room.querySelectorAll('.placed').forEach(n => n.classList.toggle('selected', n === el));
        el.style.zIndex = def.z ? def.z : 900;
      });
      el.addEventListener('pointermove', e=>{
        if(!dragging) return;
        const p = toRoom(e);
        const c = constrain(p.x + offX, p.y + offY);
        item.x = c.x; item.y = c.y;
        place(el, item, def);
        el.style.zIndex = def.z ? def.z : 900;
      });
      const stop = ()=>{ if(!dragging) return; dragging = false; place(el, item, def); };
      el.addEventListener('pointerup', stop);
      el.addEventListener('pointercancel', stop);
    });
  }

  room.addEventListener('pointerdown', e=>{
    if(!e.target.closest('.placed')){
      selectedId = null;
      room.querySelectorAll('.placed').forEach(n => n.classList.remove('selected'));
    }
  });

  document.addEventListener('keydown', e=>{
    if((e.key === 'Delete' || e.key === 'Backspace') && selectedId){
      e.preventDefault();
      removeItem(selectedId);
    }
  });

  resetBtn.addEventListener('click', ()=>{
    state = freshLayout();
    selectedId = null;
    render();
  });

  render();
})();
</script>
